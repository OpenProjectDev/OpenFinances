org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Works around a Kotlin incremental-compiler crash on Windows when the
# project drive (D:) differs from the Gradle/pub cache drive (C:):
# "this and base files have different roots" in RelocatableFileToPathConverter.
kotlin.incremental=false
# Some plugins (e.g. android_file_picker, used by file_picker) compile Java for 11 but leave Kotlin
# at its 1.8 default; Kotlin 2.4 rejects that mismatch by default. Harmless on
# Android (D8 handles both), so report it instead of failing the build.
# Still needed on the latest plugin versions (2026-10); drop once they move
# to Built-in Kotlin.
kotlin.jvm.target.validation.mode=warning
